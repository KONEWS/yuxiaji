name: Check and deploy Cloudflare

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Keep an active master deployment running; newer branch/PR checks may replace
# older checks. GitHub retains the newest pending run for each concurrency group.
concurrency:
  group: yuexiaji-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    name: Typecheck, lint and Worker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the requested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and lint
        run: npm run check
      - name: Build and run all tests
        run: npm test
      - name: Save the verified Worker and assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-dist-${{ github.sha }}
          path: |
            dist/client
            dist/server
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: yuexiaji-cloudflare-production
      cancel-in-progress: false
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.2"
          cache: npm
      - name: Install locked deployment tools
        run: npm ci
      - name: Download this run's verified build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: cloudflare-dist-${{ github.sha }}
          path: dist
      - name: Confirm master still points to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [[ "$latest_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::master has advanced. Deploy the newest master workflow run instead of rerunning this older commit."
            exit 1
          fi
      - name: Check Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN as a GitHub Actions secret and CLOUDFLARE_ACCOUNT_ID as an Actions variable or secret. See docs/GITHUB_CLOUDFLARE.md."
            exit 1
          fi
      - name: Apply D1 migrations, inspect tables and deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:built
